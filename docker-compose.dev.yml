# ============================================
# 科科灵陪诊平台 Docker Compose (开发环境)
# ============================================
# ⚠️ 警告：此配置仅用于本地开发，禁止在生产环境使用！
# 包含：
# - PostgreSQL 数据库
# - 后端 API 服务（热重载）
# - Adminer 数据库管理工具
#
# 使用方法：
# ./start.sh              # 一键启动全部
# docker-compose -f docker-compose.dev.yml up -d
# ============================================

services:
  # ==========================================
  # PostgreSQL 数据库 (开发环境)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: kekeling-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kekeling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kekeling_dev_123}
      POSTGRES_DB: ${POSTGRES_DB:-kekeling}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kekeling -d kekeling" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kekeling-network-dev

  # ==========================================
  # Redis 缓存 (开发环境)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: kekeling-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - kekeling-network-dev

  # ==========================================
  # 后端 API 服务 (开发环境 - 热重载)
  # ==========================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: kekeling-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://kekeling:kekeling_dev_123@postgres:5432/kekeling
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-kekeling_jwt_secret_dev_only}
      PORT: 3000
      TZ: Asia/Shanghai
    volumes:
      # 映射整个 server 目录实现热重载
      - ./server:/app:delegated
      # 使用命名卷保存 node_modules（避免 host/container 冲突）
      - backend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/home/stats" ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - kekeling-network-dev

  # ==========================================
  # Adminer - 数据库管理工具 (开发环境)
  # ==========================================
  adminer:
    image: adminer:latest
    container_name: kekeling-adminer-dev
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - kekeling-network-dev

# ==========================================
# 数据卷
# ==========================================
volumes:
  postgres_data_dev:
    driver: local
  backend_node_modules:
    driver: local

# ==========================================
# 网络
# ==========================================
networks:
  kekeling-network-dev:
    driver: bridge
