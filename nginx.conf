server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ============================================
    # 安全头配置
    # @see docs/终端预览器集成/安全审计报告-2024-12-13.md - P1-8
    # ============================================

    # Content Security Policy - 防止 XSS 攻击
    # script-src 'self': 只允许加载同源脚本
    # style-src 'self' 'unsafe-inline': 允许内联样式（Tailwind 需要）
    # img-src 'self' data: https:: 允许同源、data URI 和 HTTPS 图片
    # font-src 'self': 只允许同源字体
    # connect-src 'self': 只允许同源 API 请求
    # frame-ancestors 'none': 禁止被嵌入 iframe
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # X-Content-Type-Options - 防止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;

    # X-Frame-Options - 防止点击劫持
    add_header X-Frame-Options "DENY" always;

    # X-XSS-Protection - 启用浏览器 XSS 过滤
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer-Policy - 控制 Referer 头泄露
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions-Policy - 限制浏览器功能
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ============================================
    # Gzip 压缩
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # 缓存静态资源
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 代理到后端
    location /api {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SPA 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}

